<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Neighbour CSS fixture — synthetic data</title><link rel="stylesheet" href="../../src/app/globals.css"></head><body><div id="fixture"></div><script>
// Representative DOM structures matching the JSX. Not a React/Next runtime test.
const nav=(names)=>names.map(n=>`<a class="nav-link" href="#"><span class="nav-icon">◉</span><span>${n}</span></a>`).join('');
const brand='<a class="brand" href="#"><span class="brand-mark">◉</span><span><strong>Neighbour</strong><small>Marketplace</small></span></a>';
const bottom=(names)=>`<nav class="bottom-nav">${nav(names)}</nav>`;
const card=(i)=>`<article class="product card"><button class="product-image"><div class="photo">□</div></button><div class="product-body"><button class="product-name">${i%2?'Long title of a premium local product':'Fresh local product'}</button><div class="muted small storeline">Neighbourhood store</div><div class="product-price"><strong>Rs. 123,456.75</strong><button class="icon-btn add">+</button></div></div></article>`;
const market=(body)=>`<header class="market-header"><div class="header-inner">${brand}<nav class="desktop-nav">${nav(['Home','Stores','Explore'])}</nav><div class="header-actions"><a class="icon-btn" href="#">◷</a><a class="icon-btn" href="#">♧</a>${nav(['Cart','Account'])}</div></div></header><main class="market-main" id="main">${body}</main>${bottom(['Home','Stores','Explore','Cart','Account'])}`;
const checkout=`<div class="page-head"><div><h1>Checkout</h1><p>One checkout, separate orders for each store.</p></div></div><form class="split"><div class="form-stack"><section class="card panel"><h2>1. Contact details</h2>${['Full name','Phone','Email (optional)','House number / address'].map(n=>`<label class="field"><span>${n}</span><input placeholder="${n}"></label>`).join('')}</section><section class="card panel"><h2>2. Fulfilment</h2><div class="choices"><label class="choice"><input type="radio" checked>Pick up from store</label><label class="choice"><input type="radio">Seller delivery</label></div></section></div><aside class="card summary"><h2>Order summary</h2><div class="between"><span>Neighbourhood store with a long name</span><strong>Rs. 123,456.75</strong></div><div class="between total"><span>Total</span><strong>Rs. 123,456.75</strong></div><button class="btn wide" id="last-action">Place order</button></aside></form>`;
const home=`<div class="welcome-line"><div><span class="eyebrow">YOUR LOCAL MARKETPLACE</span><h1>Find something close to home.</h1></div><a class="text-link">Track order</a></div><form class="searchbar"><span>⌕</span><input placeholder="Search products, stores and more…"><button class="btn">Search</button></form><div class="hero"><div class="hero-copy"><span class="eyebrow">GOOD THINGS ARE NEARBY</span><h2>Shop from <em>local stores.</em></h2><p>Discover products from the businesses in your neighbourhood.</p><a class="btn" href="#">Explore stores →</a></div><img src="../../public/hero.svg" alt="Shop illustration" width="600" height="420"></div><section class="section"><div class="section-head"><h2>Shop by category</h2></div><div class="category-list">${Array.from({length:10},(_,i)=>`<a class="category" href="#"><span>◉</span>Category ${i}</a>`).join('')}</div></section><section class="section"><h2>Local stores</h2><div class="store-grid">${Array.from({length:4},(_,i)=>`<a href="#" class="store-card card"><div class="photo">□</div><div><strong>Neighbourhood store ${i}</strong><div class="muted small">House number 123</div><span class="status good">Open</span></div></a>`).join('')}</div></section><section class="section"><h2>Popular products</h2><div class="product-grid">${Array.from({length:8},(_,i)=>card(i)).join('')}</div></section><button class="btn" id="last-action">View products</button>`;
const dashboard=`<div class="dashboard"><aside class="sidebar"><div class="sidebar-head">${brand}</div><div class="identity"><span class="avatar">S</span><div><strong>Neighbourhood store</strong><small>Seller account</small></div></div><nav>${nav(['Overview','Orders','Products & inventory','Store settings','Payment methods','Subscription'])}</nav></aside><div class="dashboard-body"><header class="dash-header"><button class="icon-btn mobile-only">☰</button><div><strong>Seller dashboard</strong><small>Neighbour Marketplace</small></div><a class="icon-btn">♧</a><span class="avatar">S</span></header><main class="dash-main" id="main"><div class="page-head"><div><h1>Seller dashboard</h1><p>Here’s what’s happening with your store.</p></div><button class="btn">Add product</button></div><div class="metric-grid">${['Total sales','Orders','Products','Pending orders'].map((x,i)=>`<article class="card metric"><span class="metric-icon">◉</span><span class="muted">${x}</span><strong>${i?'156':'Rs. 123,456.75'}</strong></article>`).join('')}</div><div class="dashboard-grid"><section class="card panel"><h2>Sales overview</h2><p class="muted">Delivered order totals by day</p><div class="bar-chart">${Array.from({length:7},(_,i)=>`<div class="bar-column"><div class="bar" style="height:${30+i*10}%"></div><small>11-${i+1}</small></div>`).join('')}</div></section><section class="card panel"><h2>Quick actions</h2><a class="quick-action" href="#">Add new product</a></section></div><section class="card panel"><h2>Recent orders</h2>${Array.from({length:6},(_,i)=>`<a class="record" href="#"><span class="metric-icon">□</span><div class="record-main"><strong>ORD-FIXTURE-123456789${i}</strong><small>Neighbourhood store</small></div><div class="record-end"><strong>Rs. 123,456.75</strong><span class="status neutral">Pending</span></div></a>`).join('')}<button class="btn" id="last-action">View all orders</button></section></main></div>${bottom(['Overview','Orders','Products','More'])}</div>`;
const mode=new URLSearchParams(location.search).get('screen');document.querySelector('#fixture').innerHTML=mode==='dashboard'?dashboard:market(mode==='checkout'?checkout:home);
</script></body></html>
